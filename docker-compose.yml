services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./content:/app/content:ro
      - ./artifacts:/app/artifacts
      - ./var:/app/var
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-model"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
