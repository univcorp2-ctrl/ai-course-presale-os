[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courseforge"
version = "0.1.0"
description = "Budget-aware AI course generation, review, presale, and distribution automation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "feedparser>=6.0.11,<7",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
courseforge = "courseforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
courseforge = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
